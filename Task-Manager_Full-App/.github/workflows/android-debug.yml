name: Android debug APK

# Builds an installable app-debug.apk. No Android Studio and no local steps needed.
# GitHub > Actions > "Android debug APK" > Run workflow. Then download the artifact.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install packages
        run: npm install
      - name: Build the web app
        run: npm run build
      - name: Create the Android project (only if it is not in the repo yet)
        working-directory: packages/shell-mobile
        run: |
          if [ ! -d android ]; then npx cap add android; fi
      - name: Make sure the Android permissions are in the manifest
        run: |
          M=packages/shell-mobile/android/app/src/main/AndroidManifest.xml
          for P in POST_NOTIFICATIONS SCHEDULE_EXACT_ALARM RECEIVE_BOOT_COMPLETED; do
            grep -q "android.permission.$P" "$M" || sed -i "s#<application#<uses-permission android:name=\"android.permission.$P\" />\n    <application#" "$M"
          done
          grep "uses-permission" "$M"
      - name: Copy the web app into the Android project
        working-directory: packages/shell-mobile
        run: npx cap sync android
      - name: Build the debug APK
        working-directory: packages/shell-mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: task-manager-debug-apk
          path: packages/shell-mobile/android/app/build/outputs/apk/debug/app-debug.apk
